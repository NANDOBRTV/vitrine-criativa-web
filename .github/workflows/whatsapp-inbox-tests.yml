name: WhatsApp inbox tests
on:
  pull_request:
    paths:
      - 'meta-vendedor-ia/**'
      - '.github/workflows/whatsapp-inbox-tests.yml'
  push:
    branches: [feature/whatsapp-inbox-mcp]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check meta-vendedor-ia/server.js
          node --check meta-vendedor-ia/mcp.js
          node --check meta-vendedor-ia/inbox.js
      - name: Simulated inbound events
        run: node --test meta-vendedor-ia/inbox.test.js
