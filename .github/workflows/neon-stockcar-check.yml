name: Neon Rush - regressao do site
on:
  push:
    branches: [neon-rush-stockcar-v11]
    paths:
      - 'neon-rush-v1/index.html'
      - 'neon-rush-v1/stockcar-smoke.test.mjs'
      - '.github/workflows/neon-stockcar-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar HTML, JavaScript, fisica, minimapa e painel
        run: node --test neon-rush-v1/stockcar-smoke.test.mjs
