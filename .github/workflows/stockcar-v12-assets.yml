name: Stock Car V12 - gerar e validar spritesheets
on:
  push:
    branches: [neon-rush-stockcar-v12-rebuild]
    paths:
      - 'neon-rush-v1/build_stockcar_v12.py'
      - 'neon-rush-v1/index.html'
      - '.github/workflows/stockcar-v12-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V12
        uses: actions/checkout@v4
        with:
          ref: neon-rush-stockcar-v12-rebuild
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow
        run: pip install pillow==11.3.0
      - name: Gerar quadros e atualizar pacote
        run: python neon-rush-v1/build_stockcar_v12.py
      - name: Validar pacote e identificação dos carros
        run: |
          python - <<'PY'
          import base64,io,zipfile,json
          raw=base64.b64decode(open('neon-rush-v1/stockcar-web-assets.b64').read())
          z=zipfile.ZipFile(io.BytesIO(raw))
          man=json.loads(z.read('assets/stockcar/manifest.json'))
          assert len(man['cars'])==10
          for c in man['cars']:
            a=c['generated_animation'];w=c['generated_wheels']
            assert z.getinfo(a['path']).file_size>50000
            assert z.getinfo(w['path']).file_size>5000
            assert len(a['actions'])==6
          print('PASS: 10 cars, 60 animations, 10 wheel sheets, 5 effects')
          PY
      - name: Publicar pacote de assets na branch V12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neon-rush-v1/stockcar-web-assets.b64
          if ! git diff --staged --quiet; then
            git commit -m "assets: regenerate StockCar V12 sprite sheets and WebP compatible manifest"
            git push origin HEAD:neon-rush-stockcar-v12-rebuild
          fi
