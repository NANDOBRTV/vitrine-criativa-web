name: NEON RUSH V14.6.1 GameDev Master Audit QA
on:
  push:
    branches:
      - neon-rush-stockcar-v1442-gamedev-qa-20261112
      - neon-rush-v146-nitro-minimap-chat-20261112
      - neon-rush-v1461-gamedev-audit-minimap-20261113
    paths:
      - neon-rush-v1/**
      - .github/workflows/neon-rush-v1442-qa.yml
  pull_request:
    branches:
      - neon-rush-stockcar-v11
    paths:
      - neon-rush-v1/**
      - .github/workflows/neon-rush-v1442-qa.yml
permissions:
  contents: read
jobs:
  map-free-marker-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit ten independent badges and zero connecting lines
        run: node --test neon-rush-v1/qa-v1461-audit.test.cjs

  node-physics-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check WebGL, 10 km physics, nitro gifting and ten minimap markers
        run: node --test neon-rush-v1/qa-v1442.test.cjs neon-rush-v1/qa-v1450.test.cjs neon-rush-v1/qa-v1460.test.cjs neon-rush-v1/qa-v1461-audit.test.cjs

  browser-android-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test mobile 9:16 WebGL, gifts, transparent minimap and nitro
        run: |
          node neon-rush-v1/browser-smoke-v1450.cjs
          node neon-rush-v1/browser-smoke-v1460.cjs
      - name: Preserve Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-v1461-audit-android-screenshots
          path: |
            neon-rush-v1450-android-smoke.png
            neon-rush-v1460-nitro-android.png
          if-no-files-found: ignore
