name: NEON RUSH V14.7.0 Production Gate
on:
  push:
    branches:
      - neon-rush-stockcar-v1442-gamedev-qa-20261112
      - neon-rush-v146-nitro-minimap-chat-20261112
      - neon-rush-v1461-gamedev-audit-minimap-20261113
      - neon-rush-v1462-grid-minimap-20261113
      - neon-rush-v1470-release-hardening-20261115
      - neon-rush-stockcar-v11
    paths:
      - neon-rush-v1/**
      - .github/workflows/neon-rush-v1442-qa.yml
  pull_request:
    branches:
      - neon-rush-stockcar-v11
    paths:
      - neon-rush-v1/**
      - .github/workflows/neon-rush-v1442-qa.yml
permissions:
  contents: read
jobs:
  release-build-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact Render production package
        run: |
          set -euo pipefail
          test -s neon-rush-v1/index.html
          test -s neon-rush-v1/stockcar-web-assets.b64
          mkdir -p stockcar-public
          cp neon-rush-v1/index.html stockcar-public/index.html
          base64 -d neon-rush-v1/stockcar-web-assets.b64 > /tmp/neon-stockcar-assets.zip
          unzip -tq /tmp/neon-stockcar-assets.zip
          unzip -q -o /tmp/neon-stockcar-assets.zip -d stockcar-public
          test -s stockcar-public/index.html
          grep -q 'NEON RUSH V14.7.0' stockcar-public/index.html
          echo "Package OK: $(du -sh stockcar-public | awk '{print $1}')"
  map-free-marker-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit ten independent badges and zero connecting lines
        run: node --test neon-rush-v1/qa-v1461-audit.test.cjs neon-rush-v1/qa-v1462-grid.test.cjs

  node-physics-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check WebGL, 10 km physics, nitro gifting and ten minimap markers
        run: node --test neon-rush-v1/qa-v1442.test.cjs neon-rush-v1/qa-v1450.test.cjs neon-rush-v1/qa-v1460.test.cjs neon-rush-v1/qa-v1461-audit.test.cjs neon-rush-v1/qa-v1462-grid.test.cjs neon-rush-v1/qa-v1470-release.test.cjs

  browser-android-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test mobile 9:16 WebGL, gifts, transparent minimap and nitro
        run: |
          node neon-rush-v1/browser-smoke-v1450.cjs
          node neon-rush-v1/browser-smoke-v1460.cjs
          node neon-rush-v1/browser-smoke-v1462.cjs
          node neon-rush-v1/browser-production-v1470.cjs
      - name: Preserve Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-v1470-production-android-screenshots
          path: |
            neon-rush-v1450-android-smoke.png
            neon-rush-v1460-nitro-android.png
            neon-rush-v1462-grid-android.png
            neon-rush-v1470-production-mobile.png
          if-no-files-found: ignore
